<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfolio</title>
  <meta name="description" content="Portfolio" />
  <meta name="keywords" content="portfolio" />
  <meta name="author" content="" />
  <meta name="robots" content="index, follow" />
  <meta name="theme-color" content="#0a0e1a" />
  <!-- Update href with your actual portfolio URL when deployed -->
  <link rel="canonical" href="https://niteshmourya.github.io/" />
  <!-- Favicons -->
  <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg" />
  <link rel="icon" type="image/png" sizes="96x96" href="./assets/favicon-96x96.png" />
  <link rel="icon" type="image/x-icon" href="./assets/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="./assets/apple-touch-icon.png" />
  <link rel="manifest" href="./assets/site.webmanifest" />
  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="" />
  <meta property="og:title" content="Portfolio" />
  <meta property="og:description" content="Portfolio" />
  <meta property="og:image" content="" />
  <meta property="og:site_name" content="" />
  <meta property="og:locale" content="en_IN" />
  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Portfolio" />
  <meta name="twitter:description" content="Portfolio" />
  <meta name="twitter:image" content="" />
  <!-- JSON-LD Structured Data -->
  <script id="person-jsonld" type="application/ld+json">{}</script>
  <link rel="preload" href="./assets/Photo.jpg" as="image" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
    rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            dark: {
              DEFAULT: '#0a0e1a',
              lighter: '#0f1729',
              card: '#141b2d',
              border: 'rgba(34, 211, 238, 0.15)',
            },
            cyan: {
              DEFAULT: '#22d3ee',
              dark: '#06b6d4',
              light: '#67e8f9',
            },
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
        },
      },
    };
  </script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: #0a0e1a;
      color: #e2e8f0;
      line-height: 1.6;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }


    /* Animated grid background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(34, 211, 238, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(34, 211, 238, 0.03) 1px, transparent 1px);
      background-size: 50px 50px;
      animation: gridMove 20s linear infinite;
      pointer-events: none;
      z-index: 0;
    }

    @keyframes gridMove {
      0% {
        transform: translate(0, 0);
      }

      100% {
        transform: translate(50px, 50px);
      }
    }

    /* Gradient orbs */
    .gradient-orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.15;
      pointer-events: none;
      z-index: 0;
    }

    .orb-1 {
      top: 10%;
      left: 20%;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, #22d3ee 0%, transparent 70%);
      animation: float 15s ease-in-out infinite;
    }

    .orb-2 {
      bottom: 20%;
      right: 10%;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, #06b6d4 0%, transparent 70%);
      animation: float 20s ease-in-out infinite reverse;
    }

    @keyframes float {

      0%,
      100% {
        transform: translate(0, 0) scale(1);
      }

      50% {
        transform: translate(30px, -30px) scale(1.1);
      }
    }

    #root {
      position: relative;
      z-index: 1;
    }

    /* Navigation */
    nav {
      backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(34, 211, 238, 0.1);
      transition: all 0.3s ease;
    }

    nav.scrolled {
      background: rgba(10, 14, 26, 0.95);
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
    }

    /* Cards */
    .card {
      background: linear-gradient(145deg, rgba(20, 27, 45, 0.6), rgba(15, 23, 41, 0.4));
      border: 1px solid rgba(34, 211, 238, 0.15);
      border-radius: 12px;
      padding: 1.25rem 1.5rem;
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, #22d3ee, transparent);
      transform: translateX(-100%);
      transition: transform 0.6s ease;
    }

    .card:hover {
      transform: translateY(-4px);
      border-color: rgba(34, 211, 238, 0.4);
      box-shadow: 0 20px 60px rgba(34, 211, 238, 0.15);
    }

    .card:hover::before {
      transform: translateX(100%);
    }

    /* Buttons */
    .btn-primary {
      background: linear-gradient(135deg, #22d3ee 0%, #06b6d4 100%);
      color: #0a0e1a;
      font-weight: 600;
      padding: 0.875rem 2rem;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 20px rgba(34, 211, 238, 0.3);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(34, 211, 238, 0.5);
    }

    .btn-secondary {
      background: rgba(34, 211, 238, 0.1);
      color: #22d3ee;
      font-weight: 600;
      padding: 0.875rem 2rem;
      border-radius: 12px;
      border: 1px solid rgba(34, 211, 238, 0.3);
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .btn-secondary:hover {
      background: rgba(34, 211, 238, 0.2);
      border-color: #22d3ee;
    }

    /* Stats */
    .stat-card {
      background: linear-gradient(135deg, rgba(34, 211, 238, 0.1) 0%, rgba(6, 182, 212, 0.05) 100%);
      border: 1px solid rgba(34, 211, 238, 0.2);
      border-radius: 12px;
      padding: 1rem 1.25rem;
      text-align: center;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .stat-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(34, 211, 238, 0.1), transparent);
      transition: left 0.5s ease;
    }

    .stat-card:hover::before {
      left: 100%;
    }

    .stat-card:hover {
      transform: scale(1.05);
      border-color: rgba(34, 211, 238, 0.4);
    }

    .stat-value {
      font-size: 2.5rem;
      font-weight: 800;
      color: #22d3ee;
      font-family: 'JetBrains Mono', monospace;
      line-height: 1;
    }

    /* Timeline */
    .timeline {
      position: relative;
      padding-left: 3rem;
    }

    .timeline::before {
      content: '';
      position: absolute;
      left: 0.75rem;
      top: 0;
      bottom: 0;
      width: 2px;
      background: linear-gradient(180deg, #22d3ee, #06b6d4);
      opacity: 0.3;
    }

    .timeline-item {
      position: relative;
      margin-bottom: 2.5rem;
    }

    .timeline-item::before {
      content: '';
      position: absolute;
      left: -2.6rem;
      top: 0rem;
      width: 14px;
      height: 14px;
      background: #22d3ee;
      border: 3px solid #0a0e1a;
      border-radius: 50%;
      box-shadow: 0 0 0 3px rgba(34, 211, 238, 0.3);
      transition: all 0.3s ease;
    }

    .timeline-item:hover::before {
      transform: scale(1.3);
      box-shadow: 0 0 0 6px rgba(34, 211, 238, 0.3);
    }

    /* Tags */
    .tag {
      display: inline-block;
      background: rgba(34, 211, 238, 0.1);
      color: #22d3ee;
      padding: 0.375rem 0.875rem;
      border-radius: 6px;
      font-size: 0.875rem;
      font-weight: 500;
      border: 1px solid rgba(34, 211, 238, 0.2);
      margin: 0.25rem;
      transition: all 0.2s ease;
    }

    .tag:hover {
      background: rgba(34, 211, 238, 0.2);
      border-color: #22d3ee;
    }

    /* Hero Section */
    .hero-section {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      padding: 6rem 1.5rem;
    }

    .hero-title {
      font-size: clamp(2.5rem, 8vw, 5rem);
      font-weight: 800;
      line-height: 1.1;
      margin-bottom: 1.5rem;
      background: linear-gradient(135deg, #ffffff 0%, #22d3ee 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .hero-subtitle {
      font-size: clamp(1.25rem, 3vw, 2rem);
      color: #94a3b8;
      margin-bottom: 2rem;
    }

    /* Section Headers */
    .section-header {
      position: relative;
      display: inline-block;
      margin-bottom: 3rem;
    }

    .section-header::after {
      content: '';
      position: absolute;
      bottom: -0.5rem;
      left: 0;
      width: 60%;
      height: 3px;
      background: linear-gradient(90deg, #22d3ee, transparent);
    }

    /* Scroll Animations */
    .fade-in {
      opacity: 0;
      transform: translateY(30px);
      animation: fadeInUp 0.8s ease forwards;
    }

    @keyframes fadeInUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .fade-in:nth-child(1) {
      animation-delay: 0.1s;
    }

    .fade-in:nth-child(2) {
      animation-delay: 0.2s;
    }

    .fade-in:nth-child(3) {
      animation-delay: 0.3s;
    }

    .fade-in:nth-child(4) {
      animation-delay: 0.4s;
    }

    /* Mobile Menu */
    .mobile-menu {
      transform: translateX(100%);
      transition: transform 0.3s ease;
    }

    .mobile-menu.active {
      transform: translateX(0);
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 10px;
    }

    ::-webkit-scrollbar-track {
      background: #0f1729;
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(34, 211, 238, 0.3);
      border-radius: 5px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: rgba(34, 211, 238, 0.5);
    }

    /* Form Inputs */
    input,
    textarea {
      background: rgba(20, 27, 45, 0.6);
      border: 1px solid rgba(34, 211, 238, 0.2);
      border-radius: 12px;
      padding: 0.7rem !important;
      color: #e2e8f0;
      transition: all 0.3s ease;
      width: 100%;
    }

    input:focus,
    textarea:focus {
      outline: none;
      border-color: #22d3ee;
      box-shadow: 0 0 0 3px rgba(34, 211, 238, 0.1);
    }

    input::placeholder,
    textarea::placeholder {
      color: #64748b;
    }

    /* Loading Animation */
    .loading-spinner {
      border: 3px solid rgba(34, 211, 238, 0.1);
      border-top-color: #22d3ee;
      border-radius: 50%;
      width: 24px;
      height: 24px;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* Social Links */
    .social-link {
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(34, 211, 238, 0.1);
      border: 1px solid rgba(34, 211, 238, 0.2);
      border-radius: 12px;
      color: #22d3ee;
      transition: all 0.3s ease;
    }

    .social-link:hover {
      background: rgba(34, 211, 238, 0.2);
      border-color: #22d3ee;
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(34, 211, 238, 0.2);
    }

    /* WhatsApp floating action button */
    .whatsapp-fab {
      position: fixed;
      right: 18px;
      bottom: 18px;
      width: 56px;
      height: 56px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(37, 211, 102, 0.15);
      border: 1px solid rgba(37, 211, 102, 0.35);
      color: #25D366;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
      transition: all 0.2s ease;
      z-index: 60;
      backdrop-filter: blur(14px);
    }

    .whatsapp-fab:hover {
      transform: translateY(-3px);
      background: rgba(37, 211, 102, 0.22);
      border-color: rgba(37, 211, 102, 0.6);
      box-shadow: 0 18px 45px rgba(37, 211, 102, 0.18);
    }

    /* Profile Image */
    .profile-image {
      width: 340px;
      height: 380px;
      border-radius: 24px;
      border: 3px solid rgba(34, 211, 238, 0.4);
      box-shadow: 0 0 0 8px rgba(34, 211, 238, 0.08), 0 24px 60px rgba(0, 0, 0, 0.6), 0 0 40px rgba(34, 211, 238, 0.12);
      transition: all 0.3s ease;
    }

    .profile-image:hover {
      transform: scale(1.03);
      box-shadow: 0 0 0 12px rgba(34, 211, 238, 0.15), 0 30px 70px rgba(34, 211, 238, 0.25);
    }

    /* Responsive - Mobile First Enhancements */
    @media (min-width: 1024px) {
      .stat-card {
        padding: 2rem;
        border-radius: 16px;
      }
    }

    /* Scroll offset for fixed nav anchor links */
    section[id^="section-"] {
      scroll-margin-top: 5rem;
    }

    @media (min-width: 768px) {
      section[id^="section-"] {
        scroll-margin-top: 6rem;
      }
    }

    @media (min-width: 768px) {
      .card {
        padding: 2rem;
        border-radius: 16px;
      }
    }

    @media (max-width: 640px) {
      .hero-section {
        padding: 5rem 1rem 3rem;
        min-height: auto;
      }

      .hero-title {
        font-size: clamp(1.75rem, 6vw, 2.5rem);
        margin-bottom: 1rem;
      }

      .hero-subtitle {
        font-size: 1rem;
        margin-bottom: 1.5rem;
      }

      .stat-value {
        font-size: 1.5rem;
      }

      .card {
        padding: 1.25rem;
      }

      .card:hover {
        transform: none;
      }

      .timeline {
        padding-left: 1.5rem;
      }

      .timeline::before {
        left: 0.375rem;
      }

      .timeline-item::before {
        left: -1.4rem;
        width: 10px;
        height: 10px;
        border-width: 2px;
      }

      .profile-image {
        width: 220px;
        height: 250px;
        border-radius: 18px;
      }

      .orb-1,
      .orb-2 {
        width: 200px;
        height: 200px;
        opacity: 0.1;
      }

      .section-header {
        margin-bottom: 1.5rem;
      }

      .section-header::after {
        width: 40%;
      }

      .social-link {
        width: 40px;
        height: 40px;
      }

      .social-link svg {
        width: 18px;
        height: 18px;
      }

      .tag {
        font-size: 0.75rem;
        padding: 0.25rem 0.5rem;
      }

      .btn-primary,
      .btn-secondary {
        padding: 0.75rem 1.25rem;
        font-size: 0.875rem;
        min-height: 44px;
      }
    }

    @media (min-width: 641px) and (max-width: 768px) {
      .hero-section {
        padding: 5rem 1.5rem 4rem;
      }

      .stat-value {
        font-size: 1.75rem;
      }

      .card {
        padding: 1.5rem;
      }

      .profile-image {
        width: 260px;
        height: 300px;
        border-radius: 20px;
      }

      .orb-1,
      .orb-2 {
        width: 280px;
        height: 280px;
      }
    }

    @media (max-width: 768px) {
      .card:hover {
        transform: translateY(-2px);
      }

      .stat-card:hover {
        transform: scale(1.02);
      }
    }

    @media (min-width: 769px) {
      .card:hover {
        transform: translateY(-4px);
      }
    }

    /* Prevent hover effects on touch devices */
    @media (hover: none) {
      .card:hover {
        transform: none;
      }

      .stat-card:hover {
        transform: none;
      }

      .social-link:hover {
        transform: none;
      }

      .profile-image:hover {
        transform: none;
      }
    }

    /* Section spacing - consistent responsive padding */
    .section-padding {
      padding: 3rem 1rem;
    }

    @media (min-width: 640px) {
      .section-padding {
        padding: 4rem 1.5rem;
      }
    }

    @media (min-width: 1024px) {
      .section-padding {
        padding: 6rem 2rem;
      }
    }

    /* Prevent horizontal overflow */
    .overflow-x-hidden {
      overflow-x: hidden;
    }

    /* Touch-friendly tap targets */
    @media (max-width: 768px) {

      nav button,
      .social-link,
      .btn-primary,
      .btn-secondary {
        min-height: 44px;
        min-width: 44px;
      }
    }
  </style>
</head>

<body>
  <div class="gradient-orb orb-1"></div>
  <div class="gradient-orb orb-2"></div>

  <div id="root"></div>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const DEFAULT_CITATION_DATA = {
      googleScholar: { citations: 0, hIndex: 0, i10Index: 0 },
      researchGate: { reads: 0, citations: 0, recommendations: 0 },
    };

    function mergeCitationData(incoming) {
      const gs = (incoming && incoming.googleScholar) || {};
      const rg = (incoming && incoming.researchGate) || {};
      return {
        googleScholar: {
          citations: Number.isFinite(gs.citations) ? gs.citations : DEFAULT_CITATION_DATA.googleScholar.citations,
          hIndex: Number.isFinite(gs.hIndex) ? gs.hIndex : DEFAULT_CITATION_DATA.googleScholar.hIndex,
          i10Index: Number.isFinite(gs.i10Index) ? gs.i10Index : DEFAULT_CITATION_DATA.googleScholar.i10Index,
        },
        researchGate: {
          reads: Number.isFinite(rg.reads) ? rg.reads : DEFAULT_CITATION_DATA.researchGate.reads,
          citations: Number.isFinite(rg.citations) ? rg.citations : DEFAULT_CITATION_DATA.researchGate.citations,
          recommendations: Number.isFinite(rg.recommendations) ? rg.recommendations : DEFAULT_CITATION_DATA.researchGate.recommendations,
        },
      };
    }

    function getShortName(fullName) {
      if (!fullName) return "";
      const parts = String(fullName).trim().split(/\s+/).filter(Boolean);
      if (parts.length === 1) return parts[0];
      const last = parts[parts.length - 1];
      const firstInitial = parts[0][0] ? parts[0][0].toUpperCase() + "." : "";
      const secondInitial = parts.length > 2 && parts[1][0] ? parts[1][0].toUpperCase() + "." : "";
      const initials = `${firstInitial}${secondInitial}`.trim();
      return initials ? `${initials} ${last}` : last;
    }

    function setMetaBySelector(selector, content) {
      const el = document.querySelector(selector);
      if (!el) return;
      if (content === undefined || content === null || content === "") return;
      el.setAttribute("content", String(content));
    }

    function setLinkHref(selector, href) {
      const el = document.querySelector(selector);
      if (!el) return;
      if (href === undefined || href === null || href === "") return;
      el.setAttribute("href", String(href));
    }

    function applySiteMeta(data) {
      const profile = (data && data.profile) || {};
      const site = (data && data.site) || {};

      const title = site.title || [profile.name, profile.title].filter(Boolean).join(" | ") || "Portfolio";
      document.title = title;

      setMetaBySelector('meta[name="description"]', site.description);
      setMetaBySelector('meta[name="keywords"]', site.keywords);
      setMetaBySelector('meta[name="author"]', profile.name || site.author);

      setLinkHref('link[rel="canonical"]', site.canonical);

      setMetaBySelector('meta[property="og:url"]', site.canonical);
      setMetaBySelector('meta[property="og:title"]', title);
      setMetaBySelector('meta[property="og:description"]', site.description);
      setMetaBySelector('meta[property="og:image"]', site.ogImage);
      setMetaBySelector('meta[property="og:site_name"]', site.siteName);

      setMetaBySelector('meta[name="twitter:title"]', title);
      setMetaBySelector('meta[name="twitter:description"]', site.description);
      setMetaBySelector('meta[name="twitter:image"]', site.ogImage);

      const jsonld = {
        "@context": "https://schema.org",
        "@type": "Person",
        name: profile.name || undefined,
        jobTitle: profile.title || undefined,
        url: site.canonical || undefined,
        image: site.ogImage || profile.photo || undefined,
        email: profile.email || undefined,
        address: profile.location || undefined,
        sameAs: profile.links ? Object.values(profile.links).filter(Boolean) : undefined,
      };
      const jsonldEl = document.getElementById("person-jsonld");
      if (jsonldEl) jsonldEl.textContent = JSON.stringify(jsonld, null, 2);
    }

    function digitsOnly(value) {
      return String(value || "").replace(/\D/g, "");
    }

    function getWhatsAppLink(phone, message) {
      const digits = digitsOnly(phone);
      if (!digits) return null;
      const base = `https://wa.me/${digits}`;
      const text = (message || "").trim();
      return text ? `${base}?text=${encodeURIComponent(text)}` : base;
    }

    function Portfolio() {
      const [activeSection, setActiveSection] = useState("home");
      const [mobileMenuOpen, setMobileMenuOpen] = useState(false);
      const [scrolled, setScrolled] = useState(false);
      const [formData, setFormData] = useState({
        name: "",
        email: "",
        subject: "",
        message: ""
      });
      const [formStatus, setFormStatus] = useState({
        submitting: false,
        success: false,
        error: false,
        message: ""
      });

      const [portfolioData, setPortfolioData] = useState(null);
      const [loadError, setLoadError] = useState(null);
      const [citationData, setCitationData] = useState(DEFAULT_CITATION_DATA);
      const [publications, setPublications] = useState([]);
      const [experience, setExperience] = useState([]);
      const [journalPositions, setJournalPositions] = useState([]);
      const [workshops, setWorkshops] = useState([]);
      const [skills, setSkills] = useState([]);
      const [education, setEducation] = useState([]);
      const [certifications, setCertifications] = useState([]);
      const [profile, setProfile] = useState(null);
      const [researchInterests, setResearchInterests] = useState([]);

      function applyData(d) {
        setLoadError(null);
        setPortfolioData(d);
        applySiteMeta(d);
        setCitationData(mergeCitationData(d.citationData));
        setPublications(d.publications || []);
        setExperience(d.experience || []);
        setJournalPositions(d.journalPositions || []);
        setWorkshops(d.workshops || []);
        setSkills(d.skills || []);
        setEducation(d.education || []);
        setCertifications(d.certifications || []);
        setProfile(d.profile || null);
        setResearchInterests(d.researchInterests || []);
      }

      useEffect(() => {
        const url = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
          ? './portfolio-data.json'
          : './portfolio-data.json';

        fetch(url, { 
          cache: 'no-store',
          headers: {
            'Accept': 'application/json'
          }
        })
          .then(res => {
            if (!res.ok) {
              throw new Error('HTTP ' + res.status + ': ' + res.statusText);
            }
            return res.json();
          })
          .then(applyData)
          .catch((err) => {
            console.error("Failed to load portfolio-data.json:", err);
            setLoadError(
              "Could not load portfolio data. Please check your network connection or contact the site administrator."
            );
          });
      }, []);

      // Scroll handler
      useEffect(() => {
        const handleScroll = () => {
          setScrolled(window.scrollY > 50);
        };
        window.addEventListener('scroll', handleScroll);
        return () => window.removeEventListener('scroll', handleScroll);
      }, []);

      // Smooth scroll to section
      const scrollToSection = (sectionId) => {
        setActiveSection(sectionId);
        setMobileMenuOpen(false);

        if (sectionId === 'home') {
          window.scrollTo({ top: 0, behavior: 'smooth' });
          return;
        }

        setTimeout(() => {
          const element = document.getElementById(`section-${sectionId}`);
          if (element) {
            const navHeight = 80;
            const elementPosition = element.getBoundingClientRect().top;
            const offsetPosition = elementPosition + window.pageYOffset - navHeight;
            window.scrollTo({ top: offsetPosition, behavior: 'smooth' });
          }
        }, 100);
      };

      // Form handlers
      const handleFormChange = (e) => {
        const { name, value } = e.target;
        setFormData(prev => ({ ...prev, [name]: value }));
      };

      const handleFormSubmit = async (e) => {
        e.preventDefault();
        setFormStatus({ submitting: true, success: false, error: false, message: "" });

        const targetEmail = profile.email;
        const formSubmitEndpoint = `https://formsubmit.co/ajax/${encodeURIComponent(targetEmail)}`;

        try {
          const response = await fetch(formSubmitEndpoint, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "Accept": "application/json"
            },
            body: JSON.stringify({
              name: formData.name,
              email: formData.email,
              subject: formData.subject,
              message: formData.message,
              _captcha: false,
              _template: "table",
              _subject: formData.subject
            })
          });

          const data = await response.json();

          if (response.ok && data.success) {
            setFormStatus({
              submitting: false,
              success: true,
              error: false,
              message: `Thank you! Your message has been sent successfully to ${targetEmail}`
            });
            setFormData({ name: "", email: "", subject: "", message: "" });
          } else {
            throw new Error(data.message || "Form submission failed");
          }
        } catch (error) {
          console.error("Form submission error:", error);
          setFormStatus({
            submitting: false,
            success: false,
            error: true,
            message: `Sorry, there was an error. Please email directly at ${profile.email}`
          });
        }
      };

      // If error loading portfolio data
      if (loadError) {
        return (
          <div style={{ textAlign: 'center', padding: '4rem 1rem', color: '#e2e8f0' }}>
            <h2>Portfolio Loading Error</h2>
            <p>{loadError}</p>
          </div>
        );
      }

      // If portfolio data not loaded yet
      if (!portfolioData) {
        return (
          <div style={{ textAlign: 'center', padding: '4rem 1rem', color: '#e2e8f0' }}>
            <div className="loading-spinner" style={{ margin: '0 auto', marginBottom: '1rem' }}></div>
            <p>Loading portfolio...</p>
          </div>
        );
      }

      // Main content starts here
      return (
        <>
          {/* Navigation */}
          <nav className={`fixed top-0 left-0 right-0 ${scrolled ? 'scrolled' : ''} z-50`}>
            <div className="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between">
              <div className="text-2xl font-bold text-cyan">
                {profile?.name ? getShortName(profile.name) : 'NM'}
              </div>

              {/* Desktop Menu */}
              <div className="hidden md:flex gap-8">
                {['home', 'about', 'experience', 'publications', 'education', 'contact'].map(item => (
                  <button
                    key={item}
                    onClick={() => scrollToSection(item)}
                    className={`capitalize font-medium transition-colors ${
                      activeSection === item ? 'text-cyan' : 'text-gray-400 hover:text-cyan'
                    }`}
                  >
                    {item}
                  </button>
                ))}
              </div>

              {/* Mobile Menu Button */}
              <button
                className="md:hidden text-cyan"
                onClick={() => setMobileMenuOpen(!mobileMenuOpen)}
              >
                <svg width="24" height="24" fill="currentColor" viewBox="0 0 24 24">
                  <path d="M3 6h18v2H3V6zm0 5h18v2H3v-2zm0 5h18v2H3v-2z" />
                </svg>
              </button>
            </div>

            {/* Mobile Menu */}
            {mobileMenuOpen && (
              <div className="md:hidden bg-dark-lighter border-t border-dark-border p-4 space-y-4">
                {['home', 'about', 'experience', 'publications', 'education', 'contact'].map(item => (
                  <button
                    key={item}
                    onClick={() => scrollToSection(item)}
                    className="block w-full text-left capitalize font-medium text-gray-400 hover:text-cyan transition-colors"
                  >
                    {item}
                  </button>
                ))}
              </div>
            )}
          </nav>

          {/* Hero Section */}
          <section className="hero-section pt-20">
            <div className="max-w-6xl mx-auto px-4 text-center">
              <h1 className="hero-title mb-6">{profile?.name}</h1>
              <p className="hero-subtitle mb-8">{profile?.title}</p>
              <p className="text-gray-400 max-w-2xl mx-auto mb-8">
                {portfolioData?.about?.summary?.[0]}
              </p>
              <button
                onClick={() => scrollToSection('contact')}
                className="btn-primary"
              >
                Get in Touch
              </button>
            </div>
          </section>

          {/* About Section */}
          <section id="section-about" className="section-padding bg-dark-lighter">
            <div className="max-w-6xl mx-auto px-4">
              <h2 className="section-header text-4xl font-bold mb-12">About Me</h2>
              <div className="grid md:grid-cols-2 gap-12 items-center">
                <div>
                  {profile?.photo && (
                    <img src={profile.photo} alt={profile.name} className="profile-image mx-auto" />
                  )}
                </div>
                <div>
                  <p className="text-gray-300 mb-6 leading-relaxed">
                    {portfolioData?.about?.summary?.[0]}
                  </p>
                  <div className="space-y-4">
                    <div>
                      <h3 className="text-cyan font-semibold mb-2">Mission</h3>
                      <p className="text-gray-400">{portfolioData?.about?.mission?.text}</p>
                    </div>
                    <div>
                      <h3 className="text-cyan font-semibold mb-2">Vision</h3>
                      <p className="text-gray-400">{portfolioData?.about?.vision?.text}</p>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </section>

          {/* Experience Section */}
          <section id="section-experience" className="section-padding">
            <div className="max-w-6xl mx-auto px-4">
              <h2 className="section-header text-4xl font-bold mb-12">Experience</h2>
              <div className="timeline">
                {experience.map((exp, idx) => (
                  <div key={idx} className="timeline-item card fade-in">
                    <h3 className="text-cyan text-lg font-semibold">{exp.role}</h3>
                    <p className="text-gray-400 text-sm">{exp.org} • {exp.period}</p>
                    {exp.details && (
                      <ul className="mt-3 space-y-2 text-gray-300 text-sm">
                        {exp.details.map((detail, didx) => (
                          <li key={didx} className="flex gap-2">
                            <span className="text-cyan">•</span>
                            <span>{detail}</span>
                          </li>
                        ))}
                      </ul>
                    )}
                  </div>
                ))}
              </div>
            </div>
          </section>

          {/* Publications Section */}
          <section id="section-publications" className="section-padding bg-dark-lighter">
            <div className="max-w-6xl mx-auto px-4">
              <h2 className="section-header text-4xl font-bold mb-12">Publications</h2>
              <div className="grid gap-6">
                {publications.map((pub, idx) => (
                  <div key={idx} className="card fade-in">
                    <h3 className="text-cyan font-semibold mb-2">{pub.title}</h3>
                    <p className="text-gray-400 text-sm mb-2">
                      {pub.journal} • {pub.year}
                      {pub.status && <span className="ml-2 text-cyan">({pub.status})</span>}
                    </p>
                    {pub.doi && <a href={pub.doi} className="text-cyan text-sm hover:underline">DOI</a>}
                  </div>
                ))}
              </div>
            </div>
          </section>

          {/* Education Section */}
          <section id="section-education" className="section-padding">
            <div className="max-w-6xl mx-auto px-4">
              <h2 className="section-header text-4xl font-bold mb-12">Education</h2>
              <div className="timeline">
                {education.map((edu, idx) => (
                  <div key={idx} className="timeline-item card fade-in">
                    <h3 className="text-cyan text-lg font-semibold">{edu.degree}</h3>
                    <p className="text-gray-400 text-sm">{edu.institution} • {edu.period}</p>
                    {edu.grade && <p className="text-gray-400 text-sm">Grade: {edu.grade}</p>}
                  </div>
                ))}
              </div>
            </div>
          </section>

          {/* Contact Section */}
          <section id="section-contact" className="section-padding bg-dark-lighter">
            <div className="max-w-2xl mx-auto px-4">
              <h2 className="section-header text-4xl font-bold mb-12 text-center">Get in Touch</h2>
              <form onSubmit={handleFormSubmit} className="space-y-6">
                <input
                  type="text"
                  name="name"
                  placeholder="Your Name"
                  value={formData.name}
                  onChange={handleFormChange}
                  required
                />
                <input
                  type="email"
                  name="email"
                  placeholder="Your Email"
                  value={formData.email}
                  onChange={handleFormChange}
                  required
                />
                <input
                  type="text"
                  name="subject"
                  placeholder="Subject"
                  value={formData.subject}
                  onChange={handleFormChange}
                  required
                />
                <textarea
                  name="message"
                  placeholder="Your Message"
                  rows="6"
                  value={formData.message}
                  onChange={handleFormChange}
                  required
                />
                <button
                  type="submit"
                  disabled={formStatus.submitting}
                  className="btn-primary w-full"
                >
                  {formStatus.submitting ? 'Sending...' : 'Send Message'}
                </button>
                {formStatus.success && (
                  <p className="text-green-400 text-center">{formStatus.message}</p>
                )}
                {formStatus.error && (
                  <p className="text-red-400 text-center">{formStatus.message}</p>
                )}
              </form>
              <div className="mt-12 text-center">
                <p className="text-gray-400 mb-6">Or reach out via:</p>
                <div className="flex gap-4 justify-center">
                  {profile?.links?.linkedin && (
                    <a href={profile.links.linkedin} className="social-link">
                      <svg width="24" height="24" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M20.447 20.452h-3.554v-5.569c0-1.328-.475-2.236-1.986-2.236-1.081 0-1.722.722-2.004 1.418-.103.249-.129.597-.129.946v5.441h-3.554s.05-8.835 0-9.749h3.554v1.381c.432-.666 1.204-1.614 2.923-1.614 2.136 0 3.74 1.393 3.74 4.388v5.594zM5.337 8.855c-1.144 0-1.915-.758-1.915-1.704 0-.951.77-1.704 1.956-1.704 1.184 0 1.915.753 1.948 1.704 0 .946-.764 1.704-1.989 1.704zm1.586 11.597H3.584V9.558h3.339v10.894zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.225 0z" />
                      </svg>
                    </a>
                  )}
                  {profile?.links?.scholar && (
                    <a href={profile.links.scholar} className="social-link">
                      <svg width="24" height="24" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M12 0C5.372 0 0 5.373 0 12s5.372 12 12 12 12-5.373 12-12S18.628 0 12 0zm0 22C6.478 22 2 17.522 2 12S6.478 2 12 2s10 4.478 10 10-4.478 10-10 10z" />
                      </svg>
                    </a>
                  )}
                  {profile?.links?.researchgate && (
                    <a href={profile.links.researchgate} className="social-link">
                      <svg width="24" height="24" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M12 0C5.372 0 0 5.373 0 12s5.372 12 12 12 12-5.373 12-12S18.628 0 12 0zm0 22C6.478 22 2 17.522 2 12S6.478 2 12 2s10 4.478 10 10-4.478 10-10 10z" />
                      </svg>
                    </a>
                  )}
                </div>
              </div>
            </div>
          </section>

          {/* WhatsApp FAB */}
          {profile?.phone && (
            <a
              href={getWhatsAppLink(profile.phone, "Hi " + profile.name)}
              target="_blank"
              rel="noopener noreferrer"
              className="whatsapp-fab"
              title="Chat on WhatsApp"
            >
              <svg width="28" height="28" fill="currentColor" viewBox="0 0 24 24">
                <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.67-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.076 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421-7.403h-.004a8.06 8.06 0 00-8.062 8.062c0 1.469.35 2.879 1.023 4.12L1.28 23.703l4.392-1.45c1.21.659 2.567 1.034 4.02 1.034h.005a8.062 8.062 0 008.06-8.06c0-2.154-.84-4.178-2.367-5.705a8.04 8.04 0 00-5.705-2.362m6.775 12.073c-.553.553-1.358.828-2.16.828-.802 0-1.607-.275-2.16-.828-.553-.553-.828-1.358-.828-2.16 0-.803.275-1.607.828-2.16s1.358-.828 2.16-.828c.803 0 1.607.275 2.16.828.553.553.828 1.357.828 2.16 0 .802-.275 1.607-.828 2.16" />
              </svg>
            </a>
          )}
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<Portfolio />);
  </script>
</body>

</html>
